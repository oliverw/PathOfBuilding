[project]
name = "pob-mcp"
version = "0.1.0"
description = "MCP server for Path of Building — exposes build data and controls to AI agents"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.scripts]
pob-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["server.py"]
